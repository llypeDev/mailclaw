name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    # Update Mailclaw copies .github/workflows into every installation
    # repository. Set the repository variable SKIP_CHECKS=true there to keep
    # these checks from running (and using Actions minutes).
    if: vars.SKIP_CHECKS != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Same Node as Cloudflare Workers Builds, which also reads .nvmrc.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Workers Builds installs with its own npm (10.9.2 by default, or the
      # exact version in package.json "packageManager"), not the npm 11 that
      # ships with Node 24. Install with that npm, so a lockfile it would
      # reject fails here as well as in the deploy.
      - name: Use the npm Cloudflare builds with
        run: |
          version="$(node -p "(/^npm@([^+]+)/.exec(require('./package.json').packageManager || '') || [])[1] || '10.9.2'")"
          npm install --global "npm@${version}"
          npm --version
      - run: npm ci
      # Lint, the type check and one test read the generated migration bundle.
      - run: npm run db:bundle
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: node --test tests/*.test.mjs
      - run: npm run build
